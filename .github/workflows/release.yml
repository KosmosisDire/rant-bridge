# Builds the bridge on every platform. A pushed tag v<VERSION> also cuts a GitHub Release with
# the binaries attached, and the archives rant install unpacks. Run by hand it only builds, to
# check a release would.
name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # Linux builds in the manylinux_2_28 container, as Rant's wheels do, so the bridge runs on any
  # glibc since 2.28. The macos preset targets macOS 11.
  build:
    name: build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    container: ${{ matrix.container }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest,  preset: linux,   name: linux-x64, container: 'quay.io/pypa/manylinux_2_28_x86_64' }
          - { os: windows-latest, preset: windows, name: win-x64 }
          - { os: macos-15,       preset: macos,   name: osx-arm64 }
    steps:
      - uses: actions/checkout@v7

      - name: The tag matches VERSION
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: test "v$(cat VERSION)" = "$GITHUB_REF_NAME"

      - name: CMake and Ninja
        if: runner.os == 'Linux'
        run: |
          /opt/python/cp312-cp312/bin/pip install cmake ninja
          echo /opt/python/cp312-cp312/bin >> "$GITHUB_PATH"

      - name: Ninja
        if: runner.os == 'macOS'
        run: brew install ninja

      - name: Build
        run: |
          cmake --preset ${{ matrix.preset }}
          cmake --build --preset ${{ matrix.preset }}

      # The tunnel test needs multicast on loopback, which a runner may not carry.
      - name: Unit tests
        run: ctest --preset ${{ matrix.preset }} -R "^unit[.]"

      # the archive holds the package as the repo does: package.rant, the group and bin/
      - name: Stage
        shell: bash
        run: |
          mkdir -p out pkg/bin
          name="rant-bridge-$(cat VERSION)-${{ matrix.name }}"
          ext=""
          if [ -f bin/rant-bridge.exe ]; then ext=".exe"; fi
          cp "bin/rant-bridge$ext" "out/$name$ext"
          cp "bin/rant-bridge$ext" pkg/bin/
          cp package.rant Bridge.run pkg/
          tar -czf "out/$name.tar.gz" -C pkg package.rant Bridge.run bin

      - uses: actions/upload-artifact@v7
        with:
          name: rant-bridge-${{ matrix.name }}
          path: out/*

  # The Linux bridge must start on the oldest and newest distributions people run.
  check-linux:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: rant-bridge-linux-x64
          path: bin

      - name: The archive holds the package
        run: |
          mkdir pkg
          tar -xzf bin/rant-bridge-*-linux-x64.tar.gz -C pkg
          test -f pkg/package.rant && test -f pkg/Bridge.run && pkg/bin/rant-bridge --version

      - name: The bridge starts everywhere
        run: |
          chmod +x bin/*
          for image in rockylinux:8 debian:10 ubuntu:20.04 ubuntu:22.04 ubuntu:24.04; do
            echo "== $image"
            docker run --rm -v "$PWD/bin:/b" "$image" sh -c               'b=$(ls /b/rant-bridge-*-linux-x64) && $b --version && { timeout 3 $b --config /tmp/b.yaml 2>&1 || true; } | grep -q listening'
          done

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [build, check-linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: release
          merge-multiple: true

      - uses: softprops/action-gh-release@v3
        with:
          files: release/*
          generate_release_notes: true
