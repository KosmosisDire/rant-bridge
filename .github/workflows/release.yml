# Builds the bridge on every platform and packs the client. A pushed tag v<VERSION> also cuts a
# GitHub Release with both attached. Run by hand it only builds, to check a release would.
name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # Linux builds in the manylinux_2_28 container, as Rant's wheels do, so the bridge runs on any
  # glibc since 2.28. The macos preset targets macOS 11.
  build:
    name: build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    container: ${{ matrix.container }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest,  preset: linux,   name: linux-x64, container: 'quay.io/pypa/manylinux_2_28_x86_64' }
          - { os: windows-latest, preset: windows, name: win-x64 }
          - { os: macos-15,       preset: macos,   name: osx-arm64 }
    steps:
      - uses: actions/checkout@v7

      - name: The tag matches VERSION
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: test "v$(cat VERSION)" = "$GITHUB_REF_NAME"

      - name: CMake and Ninja
        if: runner.os == 'Linux'
        run: |
          /opt/python/cp312-cp312/bin/pip install cmake ninja
          echo /opt/python/cp312-cp312/bin >> "$GITHUB_PATH"

      - name: Ninja
        if: runner.os == 'macOS'
        run: brew install ninja

      - name: Build
        run: |
          cmake --preset ${{ matrix.preset }}
          cmake --build --preset ${{ matrix.preset }}

      # The client suite needs a Rant mesh, which a runner's network may not carry.
      - name: Unit tests
        run: ctest --preset ${{ matrix.preset }} -R "^unit[.]"

      - name: Stage
        shell: bash
        run: |
          mkdir -p out
          ext=""
          if [ -f bin/rant-bridge.exe ]; then ext=".exe"; fi
          cp "bin/rant-bridge$ext" "out/rant-bridge-$(cat VERSION)-${{ matrix.name }}$ext"

      - uses: actions/upload-artifact@v7
        with:
          name: rant-bridge-${{ matrix.name }}
          path: out/*

  # The Linux bridge must start on the oldest and newest distributions people run.
  check-linux:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: rant-bridge-linux-x64
          path: bin

      - name: The bridge starts everywhere
        run: |
          chmod +x bin/*
          for image in rockylinux:8 debian:10 ubuntu:20.04 ubuntu:22.04 ubuntu:24.04; do
            echo "== $image"
            docker run --rm -v "$PWD/bin:/b" "$image" sh -c               'b=$(ls /b/rant-bridge-*) && $b --version && $b --init-config --config /tmp/b.yaml && { timeout 3 $b --config /tmp/b.yaml 2>&1 || true; } | grep -q listening'
          done

  client:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Pack the client
        working-directory: client
        run: |
          npm ci
          npm run check
          npm run build
          npm pack
          mkdir -p ../out
          mv rant-client-*.tgz "../out/rant-client-$(cat ../VERSION).tgz"
      - uses: actions/upload-artifact@v7
        with:
          name: rant-client
          path: out/*

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [build, check-linux, client]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: release
          merge-multiple: true

      - uses: softprops/action-gh-release@v3
        with:
          files: release/*
          generate_release_notes: true
