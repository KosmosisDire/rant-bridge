# Builds the bridge on every platform and packs the client. A pushed tag v<VERSION> also cuts a
# GitHub Release with both attached. Run by hand it only builds, to check a release would.
name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest,  preset: linux,   name: linux-x64 }
          - { os: windows-latest, preset: windows, name: win-x64 }
          - { os: macos-15,       preset: macos,   name: osx-arm64 }
    steps:
      - uses: actions/checkout@v7

      - name: The tag matches VERSION
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: test "v$(cat VERSION)" = "$GITHUB_REF_NAME"

      - name: Ninja
        if: runner.os == 'Linux'
        run: sudo apt-get install -y ninja-build

      - name: Ninja
        if: runner.os == 'macOS'
        run: brew install ninja

      - name: Build
        run: |
          cmake --preset ${{ matrix.preset }}
          cmake --build --preset ${{ matrix.preset }}

      # The client suite needs a Rant mesh, which a runner's network may not carry.
      - name: Unit tests
        run: ctest --preset ${{ matrix.preset }} -R "^unit[.]"

      - name: Stage
        shell: bash
        run: |
          mkdir -p out
          ext=""
          if [ -f bin/rant-bridge.exe ]; then ext=".exe"; fi
          cp "bin/rant-bridge$ext" "out/rant-bridge-$(cat VERSION)-${{ matrix.name }}$ext"

      - uses: actions/upload-artifact@v7
        with:
          name: rant-bridge-${{ matrix.name }}
          path: out/*

  client:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Pack the client
        working-directory: client
        run: |
          npm ci
          npm run check
          npm run build
          npm pack
          mkdir -p ../out
          mv rant-client-*.tgz "../out/rant-client-$(cat ../VERSION).tgz"
      - uses: actions/upload-artifact@v7
        with:
          name: rant-client
          path: out/*

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [build, client]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: release
          merge-multiple: true

      - uses: softprops/action-gh-release@v3
        with:
          files: release/*
          generate_release_notes: true
