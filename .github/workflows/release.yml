# Builds the bridge on every platform. Run by hand on main it builds main, and when VERSION has
# no tag yet it also releases it: a GitHub Release with the binaries attached, and the archives
# rant install unpacks.
name: release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # Whether this run releases: on main, when no tag v<VERSION> exists yet
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.plan.outputs.version }}
      release: ${{ steps.plan.outputs.release }}
    steps:
      - uses: actions/checkout@v7

      - id: plan
        run: |
          v="$(tr -d '\r\n' < VERSION)"
          found=0
          git ls-remote --exit-code --tags origin "refs/tags/v$v" > /dev/null || found=$?
          # 2 is no such tag, anything else a lookup that went wrong
          test "$found" = 0 || test "$found" = 2
          release=false
          if [ "$GITHUB_REF" = refs/heads/main ] && [ "$found" = 2 ]; then release=true; fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "release=$release" >> "$GITHUB_OUTPUT"

  # Linux builds in the manylinux_2_28 container, as Rant's wheels do, so the bridge runs on any
  # glibc since 2.28. The macos preset targets macOS 11.
  build:
    name: build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    container: ${{ matrix.container }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest,  preset: linux,   name: linux-x64, container: 'quay.io/pypa/manylinux_2_28_x86_64' }
          - { os: windows-latest, preset: windows, name: win-x64 }
          - { os: macos-15,       preset: macos,   name: osx-arm64 }
    steps:
      - uses: actions/checkout@v7

      - name: CMake and Ninja
        if: runner.os == 'Linux'
        run: |
          /opt/python/cp312-cp312/bin/pip install cmake ninja
          echo /opt/python/cp312-cp312/bin >> "$GITHUB_PATH"

      - name: Ninja
        if: runner.os == 'macOS'
        run: brew install ninja

      - name: Build
        run: |
          cmake --preset ${{ matrix.preset }}
          cmake --build --preset ${{ matrix.preset }}

      # The tunnel test needs multicast on loopback, which a runner may not carry.
      - name: Unit tests
        timeout-minutes: 10
        run: ctest --preset ${{ matrix.preset }} -R "^unit[.]"

      # the archive holds the package as the repo does: package.rant, the group and bin/
      - name: Stage
        shell: bash
        run: |
          mkdir -p out pkg/bin
          name="rant-bridge-$(cat VERSION)-${{ matrix.name }}"
          ext=""
          if [ -f bin/rant-bridge.exe ]; then ext=".exe"; fi
          cp "bin/rant-bridge$ext" "out/$name$ext"
          cp "bin/rant-bridge$ext" pkg/bin/
          cp package.rant Bridge.run pkg/
          tar -czf "out/$name.tar.gz" -C pkg package.rant Bridge.run bin

      - uses: actions/upload-artifact@v7
        with:
          name: rant-bridge-${{ matrix.name }}
          path: out/*

  # The Linux bridge must start on the oldest and newest distributions people run.
  check-linux:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: rant-bridge-linux-x64
          path: bin

      - name: The archive holds the package
        run: |
          mkdir pkg
          tar -xzf bin/rant-bridge-*-linux-x64.tar.gz -C pkg
          test -f pkg/package.rant && test -f pkg/Bridge.run && pkg/bin/rant-bridge --version

      - name: The bridge starts everywhere
        run: |
          chmod +x bin/*
          for image in rockylinux:8 debian:10 ubuntu:20.04 ubuntu:22.04 ubuntu:24.04; do
            echo "== $image"
            docker run --rm -v "$PWD/bin:/b" "$image" sh -c               'b=$(ls /b/rant-bridge-*-linux-x64) && $b --version && { timeout 3 $b --config /tmp/b.yaml 2>&1 || true; } | grep -q listening'
          done

  # The release makes the tag v<VERSION> on this commit, once every check above passed
  release:
    needs: [plan, build, check-linux]
    if: needs.plan.outputs.release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # a later commit's run that passed too finds the version taken and stops
      - name: The version is not released from another commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          at="$(gh api "repos/$GITHUB_REPOSITORY/commits/v${{ needs.plan.outputs.version }}" --jq .sha 2>/dev/null || true)"
          test -z "$at" || test "$at" = "$GITHUB_SHA"

      - uses: actions/download-artifact@v8
        with:
          path: release
          merge-multiple: true

      - uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ needs.plan.outputs.version }}
          target_commitish: ${{ github.sha }}
          files: release/*
          generate_release_notes: true
